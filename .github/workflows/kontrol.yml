name: Kontrol
on:
  push: { branches: [main] }
  pull_request:

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: test (5x tekrar, kararsizlik avi - gecici)
        run: |
          for i in 1 2 3 4 5; do
            echo "=== deneme $i ==="
            if ! npm run test > /tmp/test-$i.log 2>&1; then
              echo "::error::Deneme $i BASARISIZ. Son 200 satir:"
              tail -n 200 /tmp/test-$i.log | while IFS= read -r line; do echo "::error::[$i] $line"; done
              exit 1
            fi
          done
      - run: npm run build
