name: Kontrol
on:
  push: { branches: [main] }
  pull_request:

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: test
        id: test
        run: npm run test 2>&1 | tee /tmp/test.log
        continue-on-error: true
      - name: teshis (gecici)
        if: steps.test.outcome == 'failure'
        run: |
          tail -n 200 /tmp/test.log | while IFS= read -r line; do echo "::error::$line"; done
          exit 1
      - run: npm run build
